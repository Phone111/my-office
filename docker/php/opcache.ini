; OPcache สำหรับ dev บน Docker (Windows bind mount)
; php artisan serve รันด้วย CLI SAPI จึงต้องเปิด enable_cli ด้วย
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; ไม่ re-stat ไฟล์เลย (เร็วที่สุดบน bind mount ที่ stat ช้า)
; เมื่อแก้โค้ด PHP ต้อง restart: docker compose restart laravel.test
opcache.validate_timestamps=0
; realpath cache ช่วยลดการ stat ไฟล์ซ้ำบน bind mount ที่ช้า
realpath_cache_size=8M
realpath_cache_ttl=600
